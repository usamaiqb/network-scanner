# detekt configuration.
#
# `buildUponDefaultConfig = true` in app/build.gradle.kts means this file only states where
# we differ from detekt's defaults. Compose-specific rules come from io.nlopez.compose.rules
# and are listed under `Compose:` at the bottom.

build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 2
    style: 1

processors:
  active: true
  exclude:
    - "FunctionCountProcessor"
    - "PropertyCountProcessor"

config:
  validation: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 8
    ignoreDefaultParameters: true
    # A composable's parameter list is its API, and hoisted state makes it long by design.
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - "Composable"
      - "Preview"

style:
  MagicNumber:
    active: true
    ignoreAnnotated: ["Composable"]
    ignoreEnums: true
    ignoreNumbers: ["-1", "0", "1", "2"]
    # A colour literal is already its own definition; naming `0xFF1E1E1E` adds nothing.
    # Nor do fixture values in tests, where the number *is* the case being tested.
    #
    # The scanning layer is excluded for a different reason: port numbers, protocol
    # timeouts and packet offsets are this app's domain vocabulary. `443, // HTTPS` in a
    # table of 89 well-known ports is already named by the protocol beside it, and a
    # constant per row would say nothing the table does not. Left on, this rule accounted
    # for 227 of 309 baseline entries — a baseline that large is not recording debt, it is
    # recording a rule that does not fit. It stays active for UI and view-model code, where
    # an unexplained literal usually is a smell.
    excludes:
      - "**/ui/theme/**"
      - "**/test/**"
      - "**/androidTest/**"
      - "**/network/**"
      - "**/util/**"
      - "**/data/DeepScanResult.kt"
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes: ["**/test/**", "**/androidTest/**"]

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase, which the default pattern rejects.
    ignoreAnnotated: ["Composable", "Preview"]
    functionPattern: "[a-z][A-Za-z0-9]*"
  TopLevelPropertyNaming:
    active: true
    # Compose names design tokens in PascalCase, and so do we. Material3's own source is
    # consistent about it — MinAlpha, MaxAlpha, DragMultiplier, MaxProgressArc are all
    # `private const val` Floats — so SCREAMING_SNAKE_CASE here would make our components
    # inconsistent with the library they wrap. Both spellings are accepted; the
    # SCREAMING_SNAKE half is for non-Compose constants, where Kotlin's convention holds.
    constantPattern: "([A-Z][A-Za-z0-9]*)|([A-Z][_A-Z0-9]*)"

  MatchingDeclarationName:
    # A file is named for the vocabulary it provides, not for whichever single class-like
    # declaration happens to be in it. ExpressiveSegments.kt holds an enum, four dp tokens
    # and seven functions; DeviceIcons.kt and EmptyState.kt have the same shape. Renaming
    # each after its one enum would describe a twelfth of the file — and for the vendored
    # shared-ui components it would also break sync.ps1, which matches copies by filename.
    active: false

Compose: # io.nlopez.compose.rules
  ComposableParametersOrdering:
    active: true
  ModifierDefaultValue:
    active: true
  MissingModifierDefaultValue:
    active: true
  PublicComposablePreview:
    active: true
